<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 14px; fill: #334155; }
      .m { font-size: 13px; fill: #475569; font-family: Menlo, monospace; }
      .lbl { font-size: 13px; fill: #475569; }
      .ln { stroke: #475569; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#ffffff"/>

  <image href="../../site/assets/kakiire-icon.svg" x="40" y="22" width="48" height="48"/>
  <text x="102" y="56" font-size="28" font-weight="700" fill="#0f172a">Kakiire システム構成</text>
  <text x="430" y="55" font-size="15" fill="#64748b">アプリ・CLI・MCP サーバーが同じ描画エンジンを使う</text>

  <g>
    <rect x="80" y="92" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="170" y="122" text-anchor="middle" class="t">使う人</text>
    <text x="170" y="145" text-anchor="middle" class="s">手で撮って書き入れる</text>

    <rect x="290" y="92" width="170" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="375" y="122" text-anchor="middle" class="t">ショートカット</text>
    <text x="375" y="145" text-anchor="middle" class="s">Siri・Spotlight</text>

    <rect x="520" y="92" width="180" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="610" y="122" text-anchor="middle" class="t">Finder</text>
    <text x="610" y="145" text-anchor="middle" class="s">.kakiire を見る</text>

    <rect x="760" y="92" width="180" height="70" rx="10" fill="#fff7ed" stroke="#fb923c"/>
    <text x="850" y="122" text-anchor="middle" class="t">AI エージェント</text>
    <text x="850" y="145" text-anchor="middle" class="s">Claude Code など</text>

    <rect x="970" y="92" width="170" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="1055" y="122" text-anchor="middle" class="t">スクリプト</text>
    <text x="1055" y="145" text-anchor="middle" class="s">シェル・CI</text>
  </g>

  <rect x="40" y="200" width="1130" height="680" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="70" y="862" font-size="15" font-weight="700" fill="#334155">あなたの Mac</text>
  <text x="180" y="862" font-size="14" fill="#64748b">画像は外に送らない(外部ライブラリなし・オフライン・テレメトリなし)</text>

  <g>
    <line x1="170" y1="162" x2="170" y2="268" class="ln" marker-end="url(#arrow)"/>
    <line x1="375" y1="162" x2="375" y2="268" class="ln" marker-end="url(#arrow)"/>
    <line x1="610" y1="162" x2="610" y2="268" class="ln" marker-end="url(#arrow)"/>
    <line x1="850" y1="162" x2="850" y2="268" class="ln" marker-end="url(#arrow)"/>
    <line x1="1055" y1="162" x2="1055" y2="268" class="ln" marker-end="url(#arrow)"/>
    <rect x="178" y="222" width="100" height="22" fill="#f8fafc"/>
    <text x="182" y="238" class="lbl">書き入れ・撮影</text>
    <rect x="383" y="222" width="72" height="22" fill="#f8fafc"/>
    <text x="387" y="238" class="lbl">アクション</text>
    <rect x="618" y="222" width="72" height="22" fill="#f8fafc"/>
    <text x="622" y="238" class="lbl">サムネイル</text>
    <rect x="760" y="222" width="82" height="22" fill="#f8fafc"/>
    <text x="841" y="238" class="lbl" text-anchor="end">MCP (stdio)</text>
    <rect x="948" y="222" width="100" height="22" fill="#f8fafc"/>
    <text x="1047" y="238" class="lbl" text-anchor="end">コマンド + JSON</text>
  </g>

  <g>
    <rect x="70" y="270" width="400" height="200" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="92" y="304" class="t">Kakiire.app</text>
    <text x="232" y="304" class="s">Swift + AppKit</text>
    <text x="92" y="336" class="s">・エディター(矢印・枠・文字・吹き出し・モザイク)</text>
    <text x="92" y="362" class="s">・撮影 ⌃⇧⌘5、メニューバーに常駐</text>
    <text x="92" y="388" class="s">・レイヤーパネル、Undo、自動保存と版の履歴</text>
    <text x="92" y="414" class="s">・App Intents(「ショートカット」のアクション)</text>
    <text x="92" y="440" class="s">・ドラッグでブラウザー・Slack へ貼る</text>

    <rect x="500" y="270" width="220" height="200" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="522" y="304" class="t">Quick Look 拡張</text>
    <text x="522" y="336" class="s">・Thumbnail</text>
    <text x="540" y="362" class="s">Finder のアイコン</text>
    <text x="522" y="388" class="s">・Preview</text>
    <text x="540" y="414" class="s">スペースキーで中身を表示</text>

    <rect x="750" y="270" width="400" height="200" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="772" y="304" class="t">kakiire</text>
    <text x="852" y="304" class="s">CLI / MCP サーバー(KakiireTooling)</text>
    <text x="772" y="336" class="s">・CLI</text>
    <text x="796" y="360" class="m">info / annotate / export</text>
    <text x="772" y="390" class="s">・MCP のツール</text>
    <text x="796" y="414" class="m">get_image_info / annotate_image</text>
    <text x="772" y="444" class="s">・注釈を JSON で受け取り、描いて書き出す</text>
  </g>

  <g>
    <line x1="270" y1="470" x2="270" y2="528" class="ln" marker-end="url(#arrow)"/>
    <line x1="610" y1="470" x2="610" y2="528" class="ln" marker-end="url(#arrow)"/>
    <line x1="780" y1="470" x2="780" y2="528" class="ln" marker-end="url(#arrow)"/>
  </g>

  <rect x="70" y="530" width="730" height="110" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="92" y="564" class="t">KakiireIO</text>
  <text x="200" y="564" class="s">ファイルの読み書き</text>
  <text x="92" y="594" class="s">・.kakiire(zip)の読み書き ・PNG / JPEG の書き出し(メタデータを除く)</text>
  <text x="92" y="620" class="s">・Quick Look 用のプレビュー画像を返す</text>

  <line x1="435" y1="640" x2="435" y2="698" class="ln" marker-end="url(#arrow)"/>
  <text x="447" y="675" class="lbl">App → IO → Core の一方向</text>

  <rect x="70" y="700" width="730" height="120" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="92" y="734" class="t">KakiireCore</text>
  <text x="222" y="734" class="s">AppKit を使わない中核</text>
  <text x="92" y="764" class="s">・Document(値型)を EditOperation で変える。Undo はスナップショット</text>
  <text x="92" y="790" class="s">・Renderer:画面と書き出しで共通。画像 → モザイク・ぼかし → ハイライター → 図形の順</text>

  <g>
    <path d="M800,585 H815" class="ln"/>
    <path d="M815,570 V770" class="ln"/>
    <line x1="815" y1="570" x2="838" y2="570" class="ln" marker-end="url(#arrow)"/>
    <line x1="815" y1="670" x2="838" y2="670" class="ln" marker-end="url(#arrow)"/>
    <line x1="815" y1="770" x2="838" y2="770" class="ln" marker-end="url(#arrow)"/>

    <rect x="840" y="530" width="310" height="80" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="858" y="560" class="t" font-size="17">画像ファイル</text>
    <text x="858" y="588" class="s">PNG / JPEG / WebP(上書きしない)</text>

    <rect x="840" y="630" width="310" height="80" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="858" y="660" class="t" font-size="17">.kakiire 文書(zip)</text>
    <text x="858" y="688" class="s">document.json + 元画像 + preview.png</text>

    <rect x="840" y="730" width="310" height="90" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="858" y="760" class="t" font-size="17">書き出した画像</text>
    <text x="858" y="786" class="s">PNG / JPEG。モザイク前の画像も</text>
    <text x="858" y="806" class="s">位置情報などのメタデータも残らない</text>
  </g>

  <rect x="1220" y="200" width="340" height="680" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="1244" y="236" font-size="19" font-weight="700" fill="#0f172a">配布・公開</text>
  <g>
    <rect x="1244" y="258" width="292" height="74" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1262" y="288" class="t" font-size="17">GitHub リポジトリ</text>
    <text x="1262" y="314" class="s">ソースを MIT ライセンスで公開</text>

    <line x1="1390" y1="332" x2="1390" y2="368" class="ln" marker-end="url(#arrow)"/>

    <rect x="1244" y="370" width="292" height="96" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1262" y="400" class="t" font-size="17">GitHub Actions</text>
    <text x="1262" y="426" class="s">ビルド・テスト</text>
    <text x="1262" y="448" class="s">Developer ID 署名・Apple の公証</text>

    <line x1="1390" y1="466" x2="1390" y2="502" class="ln" marker-end="url(#arrow)"/>

    <rect x="1244" y="504" width="292" height="74" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1262" y="534" class="t" font-size="17">GitHub Releases</text>
    <text x="1262" y="560" class="s">Kakiire.dmg / CLI の zip</text>

    <line x1="1390" y1="578" x2="1390" y2="614" class="ln" marker-end="url(#arrow)"/>

    <rect x="1244" y="616" width="292" height="96" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1262" y="646" class="t" font-size="17">Homebrew tap</text>
    <text x="1262" y="672" class="m" style="font-size:11px">brew install --cask sumihiro3/tap/kakiire</text>
    <text x="1262" y="694" class="m" style="font-size:11px">brew install sumihiro3/tap/kakiire</text>

    <rect x="1244" y="752" width="292" height="74" rx="10" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1262" y="782" class="t" font-size="17">LP(Cloudflare Pages)</text>
    <text x="1262" y="808" class="s">kakiire.tep-lab.com(日本語・英語)</text>

    <line x1="1244" y1="541" x2="1174" y2="541" class="ln" marker-end="url(#arrow)"/>
    <line x1="1244" y1="664" x2="1174" y2="664" class="ln" marker-end="url(#arrow)"/>
    <text x="1180" y="530" class="lbl" font-size="12">入れる</text>
  </g>
</svg>
