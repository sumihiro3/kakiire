<!doctype html>
<!-- 使用例の元画面。架空のメモアプリ「ミライノート」で、保存に失敗した場面 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ミライノート</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1280px; height: 800px; overflow: hidden; background: #e9ebef;
         font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; color: #1d1d1f; }
  .win { position: absolute; inset: 40px 80px; background: #fff; border-radius: 14px; overflow: hidden;
         box-shadow: 0 20px 60px rgba(0,0,0,.18); display: grid; grid-template-rows: 52px 1fr; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 0 18px; background: #f6f6f8; border-bottom: 1px solid #e3e3e8; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .bar h1 { flex: 1; text-align: center; font-size: 15px; font-weight: 600; }
  .bar .save { font-size: 13px; padding: 6px 16px; border-radius: 7px; background: #1e7cf0; color: #fff; font-weight: 600; }
  .body { display: grid; grid-template-columns: 260px 1fr; }
  aside { background: #f6f6f8; border-right: 1px solid #e3e3e8; padding: 14px 10px; }
  .note { padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; }
  .note b { display: block; font-size: 14px; }
  .note span { font-size: 12px; color: #6e6e73; }
  .note.on { background: #dbe8fc; }
  main { padding: 0; position: relative; }
  .err { margin: 18px 28px 0; padding: 14px 18px; border-radius: 10px; background: #fdecec; border: 1px solid #f5b5b5; display: flex; gap: 12px; align-items: flex-start; }
  .err i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: #e82a2a; color: #fff; display: grid; place-items: center; font-weight: 700; flex: none; }
  .err b { font-size: 15px; color: #b3261e; }
  .err p { font-size: 13px; color: #5f2120; margin-top: 4px; }
  .err code { font-family: "SF Mono", Menlo, monospace; font-size: 12px; background: #fff; padding: 1px 6px; border-radius: 4px; border: 1px solid #f5b5b5; }
  .err .retry { margin-left: auto; font-size: 13px; padding: 6px 14px; border-radius: 7px; border: 1px solid #e3a3a3; background: #fff; color: #b3261e; white-space: nowrap; }
  article { padding: 24px 40px; }
  article h2 { font-size: 26px; margin-bottom: 6px; }
  article .meta { font-size: 12px; color: #6e6e73; margin-bottom: 18px; }
  article p { font-size: 16px; line-height: 2; }
  .status { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; border-top: 1px solid #ececf0; font-size: 12px; color: #6e6e73; display: flex; align-items: center; padding: 0 20px; gap: 18px; }
  .status .ng { color: #b3261e; }
</style>
</head>
<body>
<div class="win">
  <div class="bar">
    <span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span>
    <h1>ミライノート</h1><span class="save">保存</span>
  </div>
  <div class="body">
    <aside>
      <div class="note on"><b>旅行の持ち物リスト</b><span>編集中</span></div>
      <div class="note"><b>読みたい本</b><span>11月16日</span></div>
      <div class="note"><b>会議メモ 11/14</b><span>11月14日</span></div>
      <div class="note"><b>レシピ:かぼちゃのスープ</b><span>11月10日</span></div>
    </aside>
    <main>
      <div class="err"><i>!</i><div><b>メモを保存できませんでした</b><p>同期サーバーから応答がありません <code>E-502 sync timeout</code></p></div><span class="retry">もう一度試す</span></div>
      <article>
        <h2>旅行の持ち物リスト</h2>
        <p class="meta">最後に保存:11月17日 9:12</p>
        <p>・充電器とモバイルバッテリー<br>・折りたたみ傘<br>・常備薬<br>・チケットの控え(スマホに保存済み)<br>・羽織るもの(朝晩は冷える)</p>
      </article>
      <div class="status"><span>412 文字</span><span class="ng">● 未保存の変更があります</span><span>同期:オフライン</span></div>
    </main>
  </div>
</div>
</body>
</html>
