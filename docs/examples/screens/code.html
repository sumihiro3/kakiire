<script type="text/plain" id="src">    /// 描画に必要なチャンク(と色の解釈に要るもの)だけを残す。
    static let keptPNGChunks: Set<String> = ["IHDR", "PLTE", "tRNS", "IDAT", "IEND", "iCCP", "sRGB", "cHRM", "gAMA", "pHYs"]

    /// ImageIO が付ける eXIf などのメタデータチャンクを取り除く。チャンクごとに CRC が独立しているので、
    /// 丸ごと抜いても残りはそのまま有効。形式が崩れていれば元のデータを返す。
    static func stripPNGMetadata(_ png: Data) -> Data {
        let b = [UInt8](png)
        guard b.count > 8 else { return png }
        var out = Data(b[0..<8])
        var i = 8
        while i + 12 <= b.count {
            let len = Int(b[i]) << 24 | Int(b[i + 1]) << 16 | Int(b[i + 2]) << 8 | Int(b[i + 3])
            let end = i + 12 + len
            guard end <= b.count, let type = String(bytes: b[(i + 4)..<(i + 8)], encoding: .ascii) else { return png }
            if keptPNGChunks.contains(type) { out.append(contentsOf: b[i..<end]) }
            i = end
        }
        return out
    }</script>
<script>
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const hl = line => {
  if (/^\s*\/\/\//.test(line)) return `<span class="c">${esc(line)}</span>`;
  return esc(line)
    .replace(/("[^"]*")/g, '<span class="s">$1</span>')
    .replace(/\b(static|let|var|func|guard|else|return|while|if|in)\b/g, '<span class="k">$1</span>')
    .replace(/\b(Data|Int|UInt8|Set|String)\b/g, '<span class="t">$1</span>')
    .replace(/(?<![\w#])(\d+)(?![\w"])/g, '<span class="n">$1</span>');
};
const lines = document.getElementById("src").textContent.split("\n");
document.getElementById("code").innerHTML = lines.map((l, i) => `<span class="ln">${86 + i}</span>${hl(l)}`).join("\n");
</script>
