name: CI

on:
  # LP(site/)とその素材づくり、文書、リリースの仕組みだけの変更では、アプリのテストとビルドを走らせない
  # (アプリのコードと一緒に変えたときは走る)
  push:
    branches: [main]
    paths-ignore:
      - site/**
      - scripts/og/**
      - scripts/lp-shots/**
      - scripts/build-site.sh
      - scripts/bump-version.sh
      - scripts/changelog-section.sh
      - .github/workflows/release.yml
      - docs/**
      - '**.md'
  pull_request:
    paths-ignore:
      - site/**
      - scripts/og/**
      - scripts/lp-shots/**
      - scripts/build-site.sh
      - scripts/bump-version.sh
      - scripts/changelog-section.sh
      - .github/workflows/release.yml
      - docs/**
      - '**.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # SWIFT_DEFAULT_ACTOR_ISOLATION と String Catalog のため Xcode 26 が要る
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Xcode のバージョン
        run: xcodebuild -version

      - name: 単体テスト(Core / IO / Tooling)
        run: swift test

      # 配る形(Release)でもコンパイルできることを確かめる。署名・公証は ADR 0008
      - name: CLI の Release ビルド
        run: swift build -c release --product kakiire

      - name: XcodeGen を入れる
        run: brew install xcodegen

      - name: プロジェクトを生成
        run: xcodegen generate

      # 証明書を持たないランナーなので ad-hoc 署名でビルドし、App と Quick Look 拡張がコンパイルできることだけ確かめる
      - name: アプリをビルド
        run: |
          xcodebuild -project Kakiire.xcodeproj -scheme Kakiire -configuration Debug \
            -derivedDataPath build/DerivedData build \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -quiet
