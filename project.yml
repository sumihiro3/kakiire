name: Kakiire
options:
  bundleIdPrefix: com.tep-lab
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: ja
packages:
  KakiireKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kakiire:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: KakiireKit
        product: KakiireCore
      - package: KakiireKit
        product: KakiireIO
      - target: KakiireThumbnail
      - target: KakiirePreview
      - sdk: AppIntents.framework
    entitlements:
      path: App/Kakiire.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kakiire
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        CFBundleName: Kakiire
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.graphics-design
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 TEP-Lab"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.tep-lab.kakiire
            UTTypeDescription: Kakiire 文書
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [kakiire]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Kakiire 文書
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.tep-lab.kakiire]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).KakiireDocument
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg, public.heic, public.tiff, com.compuserve.gif, com.microsoft.bmp, org.webmproject.webp]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).KakiireDocument
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tep-lab.kakiire
        PRODUCT_NAME: Kakiire
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: EBBVRDHK5Z
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  KakiireThumbnail:
    templates: [QuickLookExtension]
    sources: [Extensions/Thumbnail]
    dependencies:
      - sdk: QuickLookThumbnailing.framework
    entitlements:
      path: Extensions/Thumbnail/KakiireThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Extensions/Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: KakiireThumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.tep-lab.kakiire]
            QLThumbnailMinimumDimension: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tep-lab.kakiire.thumbnail
  KakiirePreview:
    templates: [QuickLookExtension]
    sources: [Extensions/Preview]
    dependencies:
      - sdk: Quartz.framework
    entitlements:
      path: Extensions/Preview/KakiirePreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: Extensions/Preview/Info.plist
      properties:
        CFBundleDisplayName: KakiirePreview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.tep-lab.kakiire]
            QLIsDataBasedPreview: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tep-lab.kakiire.preview
targetTemplates:
  QuickLookExtension:
    type: app-extension
    platform: macOS
    dependencies:
      - package: KakiireKit
        product: KakiireCore
      - package: KakiireKit
        product: KakiireIO
    settings:
      base:
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: EBBVRDHK5Z
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  Kakiire:
    build:
      targets:
        Kakiire: all
    run:
      config: Debug
