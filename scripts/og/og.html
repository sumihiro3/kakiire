<!doctype html>
<!-- LP の OGP 画像(1200×630)の元。render.sh が Chrome で PNG にする。#en を付けると英語版
     正方形(はてブ・Instagram など)や縦長に中央で切り抜かれても読めるよう、見出しと層の図は中央の 504px 幅に収める。
     左右(名前・辞書の1行・層の名前)は、横長で表示されたときだけ見える飾り -->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../site/style.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { position: relative; }

  .og-head {
    position: absolute;
    left: 348px;
    width: 504px;
    top: 34px;
    margin: 0;
    padding: 0;
    text-align: center;
    font-size: 70px;
    line-height: 1.16;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  html[lang="en"] .og-head { font-size: 66px; line-height: 1.1; }

  .og-stack { position: absolute; left: 427px; top: 214px; width: 346px; height: 400px; }

  .og-side { position: absolute; top: 56px; bottom: 56px; display: flex; flex-direction: column; justify-content: space-between; }
  .og-left { left: 56px; width: 230px; }
  .og-brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 700; }
  .og-brand img { width: 46px; height: 46px; }
  .og-left .dict { font-size: 16px; line-height: 1.6; }
  .og-left .dict__word { display: block; }
  .og-meta { margin: 0; font-family: var(--mono); font-size: 14px; line-height: 1.7; color: var(--muted); }

  .og-labels { position: absolute; left: 0; top: 0; width: 1200px; height: 630px; }
  .og-labels line { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; }
  .og-label { position: absolute; left: 944px; width: 200px; display: flex; flex-direction: column; }
  .og-label b { font-size: 17px; font-weight: 700; line-height: 1.4; }
  .og-label span { font-size: 13px; line-height: 1.4; color: var(--muted); }

  /* 左の空きに、AI から頼む例を置く。層の図の左の角(x 約 440)にかからない幅にする */
  .og-ai { position: absolute; left: 56px; top: 370px; width: 340px; margin: 0; padding: 14px 18px;
    border-radius: 8px; background: var(--ink); box-shadow: 0 8px 0 var(--shadow); color: #e8eaee;
    font-family: var(--mono); font-size: 14px; line-height: 1.7; }
  .og-ai b { font-weight: 500; color: #fff; }
  .og-ai__label { display: block; margin-bottom: 4px; font-family: var(--sans); font-size: 13px; font-weight: 700; color: #fff; }
  .og-ai__label i { font-style: normal; margin-left: 6px; padding: 0 6px; border-radius: 4px; background: var(--yellow); color: var(--ink); font-family: var(--mono); font-weight: 500; }
</style>
</head>
<body>
  <div class="og-side og-left">
    <div class="og-brand"><img src="../../site/assets/kakiire-icon.svg" alt=""><span>Kakiire</span></div>
    <p class="dict" data-ja='<span class="dict__word">かきいれ【書き入れ】</span>画像や書類に、文字や印を書き加えること。' data-en='<span class="dict__word">kakiire【書き入れ】</span>Japanese: writing words or marks onto an image or a document.'></p>
    <p class="og-meta" data-ja="無料の Mac アプリ<br>macOS 15+ / Apple Silicon<br>kakiire.tep-lab.com" data-en="Free Mac app<br>macOS 15+ / Apple Silicon<br>kakiire.tep-lab.com"></p>
  </div>

  <p class="og-ai" data-ja='<span class="og-ai__label">AI からも書き入れ<i>MCP</i></span><span class="term__you">&gt; 保存ボタンを赤枠で囲んで</span><br><span class="term__tool">●</span> kakiire · <b>annotate_image</b>' data-en='<span class="og-ai__label">AI agents can mark up too<i>MCP</i></span><span class="term__you">&gt; Box the Save button in red</span><br><span class="term__tool">●</span> kakiire · <b>annotate_image</b>'></p>

  <h1 class="og-head" data-ja='スクショに<br><span class="h1-bracket">「</span><span class="hl">書き入れ</span>」。' data-en='Mark up your<br><span class="hl">screenshots</span>.'></h1>

  <svg class="og-stack" viewBox="0 0 545 630" aria-hidden="true">
    <path class="stack-guide" d="M22.5 183.4 V498.4 M517.5 126.6 V441.6 M220.5 297 V612"/>
    <g transform="matrix(0.7071 -0.4056 0.7071 0.4056 22.5 498.4)">
      <rect class="sheet-shadow" x="14" y="14" width="420" height="280"/>
      <image data-src="hero-base.png" width="420" height="280" preserveAspectRatio="none"/>
      <rect class="sheet sheet--outline" width="420" height="280"/>
    </g>
    <g transform="matrix(0.7071 -0.4056 0.7071 0.4056 22.5 393.4)">
      <rect class="sheet" width="420" height="280"/>
      <image data-src="hero-effect.png" width="420" height="280" preserveAspectRatio="none"/>
    </g>
    <g transform="matrix(0.7071 -0.4056 0.7071 0.4056 22.5 288.4)">
      <rect class="sheet" width="420" height="280"/>
      <image data-src="hero-highlight.png" width="420" height="280" preserveAspectRatio="none"/>
    </g>
    <g transform="matrix(0.7071 -0.4056 0.7071 0.4056 22.5 183.4)">
      <rect class="sheet" width="420" height="280"/>
      <image data-src="hero-shapes.png" width="487.88" height="280" preserveAspectRatio="none"/>
    </g>
  </svg>

  <!-- AI の例から、層の図の赤枠へ点線を引く(AI が描いた枠だと分かるように) -->
  <svg class="og-ai-link" width="1200" height="630" aria-hidden="true" style="position:absolute;left:0;top:0;pointer-events:none">
    <path d="M396 392 C 470 392, 510 380, 552 380" fill="none" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="555" cy="380" r="3.5" fill="var(--red)"/>
  </svg>

  <!-- 層の名前。各層の右の角の高さ(層の図の座標 y)に置く。点線は正方形の切り抜き(x 285〜915)の外だけに引く -->
  <svg class="og-labels" aria-hidden="true"></svg>
  <div class="og-label" data-y="126.6"><b data-ja="図形" data-en="Shapes"></b><span data-ja="矢印・枠・文字・スタンプ" data-en="Arrows, boxes, text, stamps"></span></div>
  <div class="og-label" data-y="231.6"><b data-ja="ハイライター" data-en="Highlighter"></b><span data-ja="下の文字が透ける" data-en="Text shows through"></span></div>
  <div class="og-label" data-y="336.6"><b data-ja="モザイク・ぼかし" data-en="Pixelate &amp; Blur"></b><span data-ja="見せたくないところを隠す" data-en="Hide what shouldn't be seen"></span></div>
  <div class="og-label" data-y="441.6"><b data-ja="元のスクショ" data-en="Original"></b><span data-ja="取り込んだときのまま" data-en="Exactly as captured"></span></div>

  <script>
    const lang = location.hash === "#en" ? "en" : "ja";
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-ja]").forEach((el) => { el.innerHTML = el.dataset[lang]; });
    const dir = lang === "en" ? "../../site/assets/en/" : "../../site/assets/";
    document.querySelectorAll("image[data-src]").forEach((el) => el.setAttribute("href", dir + el.dataset.src));

    // 層の図の座標を画面の座標にして、名前と点線を置く
    const stack = document.querySelector(".og-stack").getBoundingClientRect();
    const k = stack.height / 630;
    const lines = document.querySelector(".og-labels");
    document.querySelectorAll(".og-label").forEach((label) => {
      const y = stack.top + Number(label.dataset.y) * k;
      label.style.top = `${y - 12}px`;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", 918);
      line.setAttribute("x2", 934);
      line.setAttribute("y1", y);
      line.setAttribute("y2", y);
      lines.append(line);
    });
  </script>
</body>
</html>
