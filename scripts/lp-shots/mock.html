<!doctype html>
<html lang="ja">

<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body { position: relative; background: #f5f6f8; color: #1d1d1f; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif; -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .top { left: 0; top: 0; width: 1280px; height: 56px; background: #1f2a44; }
  .side { left: 0; top: 56px; width: 240px; height: 744px; background: #fff; border-right: 1px solid #e3e5ea; }
  .nav { left: 16px; width: 208px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; line-height: 36px; color: #454851; }
  .nav.on { background: #eaf1fe; color: #1466d6; font-weight: 600; }
  .card { background: #fff; border: 1px solid #e3e5ea; border-radius: 12px; }
  .label { font-size: 13px; color: #6b6f7a; }
  .input { width: 400px; height: 44px; padding: 0 14px; border: 1px solid #cfd3da; border-radius: 8px; font-size: 15px; line-height: 42px; background: #fff; }
  .toggle { width: 44px; height: 24px; border-radius: 12px; background: #c9cdd6; }
  .toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
  .toggle.on { background: #1466d6; }
  .toggle.on::after { left: 22px; }
  .row { font-size: 14px; color: #1d1d1f; }
  .muted { color: #6b6f7a; }
</style>
</head>
